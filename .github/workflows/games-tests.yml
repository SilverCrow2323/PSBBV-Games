name: Games Host Tests
on:
  push:
    branches: [main]
    paths: ["include/**", "src/**", "tests/**", "CMakeLists.txt", ".github/workflows/games-tests.yml"]
  pull_request:
    paths: ["include/**", "src/**", "tests/**", "CMakeLists.txt", ".github/workflows/games-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
